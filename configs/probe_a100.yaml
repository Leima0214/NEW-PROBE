

# A100-optimised PROBE config (~80 GB VRAM)
# Usage: python scripts/train.py --config configs/probe_a100.yaml --phase 3
#        --resume checkpoints_from_v100/probe_final.pt
seed: 42
device: cuda

backbone:
  name: vit_base_patch16_224
  embed_dim: 768
  frozen: true

spem:
  pca_dim: 50
  num_prototypes: 10
  kmeans_iters: 25
  prompt_hidden_dim: 256
  injection_layers: [0, 6]
  prompt_temperature: 0.2
  prompt_weight: 1.0

dapa:
  projection_dim: 256
  weight: 0.5

ssl:
  hidden_dim: 2048
  out_dim: 2048

detection:
  num_classes: 4   # paper: 4 road-damage classes (D00-D40, excl. missing class)
  hidden_dim: 256
  head_depth: 3
  source_label_fraction: 0.1
  cls_prior: 0.01  # paper-aligned: log(0.01) ≈ -4.595 bias → ~1% positive prior

detection_optim:
  lr: 0.001             # paper: 1e-3 for detection head
  lr_min: 0.000001
  weight_decay: 0.0001
  epochs: 100            # paper-aligned: 100 epochs
  warmup_epochs: 5       # linear warmup
  grad_clip: 1.0         # paper recommendation
  focal_alpha: 0.25
  focal_gamma: 2.0
  box_weight: 5.0        # paper: λ_box = 5.0 for GIoU
  ctr_weight: 0.0        # paper: C+4, no centerness/objectness branch
  score_threshold: 0.005
  nms_threshold: 0.5
  val_interval: 5
  center_sampling_radius: 2.5  # wider radius for road-damage small/long cracks

optim:
  lr: 0.0005
  weight_decay: 0.05
  pretrain_epochs: 100

data:
  source_manifest: /PROBE/data/united_states_train.jsonl       # 改为 United_train.jsonl 按需
  target_manifest: /PROBE/data/Czech_unlabeled.jsonl
  val_manifest: /PROBE/data/czech_val.jsonl   # 或 United_val.jsonl
  image_root: /PROBE/data/images
  batch_size: 32                                # A100 80GB 可用 32-64
  num_workers: 8                                # 匹配云实例 CPU
