# A100-optimized Japan-to-Czech PROBE reproduction config.
# Phase 3 only:
# python scripts/train.py --config configs/probe_a100.yaml --phase 3 \
#   --resume checkpoints/probe_final.pt --device cuda --image-size 512
seed: 42
device: cuda

backbone:
  name: vit_base_patch16_224
  embed_dim: 768
  frozen: true

spem:
  pca_dim: 50
  num_prototypes: 10
  kmeans_iters: 25
  prompt_hidden_dim: 256
  injection_layers: [0, 6]
  prompt_temperature: 0.2
  prompt_weight: 1.0

dapa:
  projection_dim: 256
  weight: 0.5

ssl:
  hidden_dim: 2048
  out_dim: 2048

detection:
  num_classes: 4
  architecture: paper
  paper_mid_dim: 384
  paper_neck_dim: 128
  hidden_dim: 256          # Used only by architecture=fcos.
  head_depth: 3            # Used only by architecture=fcos.
  source_label_fraction: 1.0
  cls_prior: 0.01

detection_optim:
  # The paper does not disclose the Phase 3 optimizer recipe. These values
  # are explicit reproduction assumptions for the lightweight head.
  lr: 0.001
  lr_min: 0.000001
  weight_decay: 0.0001
  epochs: 100
  warmup_epochs: 5
  grad_clip: 1.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  box_weight: 2.0
  ctr_weight: 0.0
  box_mode: center_size
  score_threshold: 0.005
  nms_threshold: 0.5
  val_interval: 5
  center_sampling_radius: 1.0

optim:
  lr: 0.0005
  weight_decay: 0.05
  pretrain_epochs: 100

data:
  source_manifest: /PROBE/data/japan_train.jsonl
  source_val_manifest: /PROBE/data/japan_val.jsonl
  target_manifest: /PROBE/data/Czech_unlabeled.jsonl
  val_manifest: /PROBE/data/czech_val.jsonl
  image_root: /PROBE/data/images
  batch_size: 32
  num_workers: 8
