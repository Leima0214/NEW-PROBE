# PROBE-inspired enhanced Japan-to-Czech configuration.
# Keeps ViT frozen but jointly adapts the prompt projector and detection head.
seed: 42
device: cuda

backbone:
  name: vit_base_patch16_224
  embed_dim: 768
  frozen: true
  detection_layers: [2, 5, 8, 11]

spem:
  pca_dim: 50
  num_prototypes: 10
  kmeans_iters: 25
  prompt_hidden_dim: 256
  injection_layers: [0, 6]
  prompt_temperature: 0.2
  prompt_weight: 1.0

dapa:
  projection_dim: 256
  weight: 0.5

ssl:
  hidden_dim: 2048
  out_dim: 2048

detection:
  num_classes: 4
  architecture: fcos
  paper_mid_dim: 384
  paper_neck_dim: 128
  hidden_dim: 256
  head_depth: 3
  source_label_fraction: 1.0
  cls_prior: 0.01

detection_optim:
  lr: 0.001
  prompt_lr: 0.00005
  train_prompt_projector: true
  train_vit_last_n: 4
  backbone_lr: 0.00001
  lr_min: 0.000001
  weight_decay: 0.0001
  epochs: 20
  warmup_epochs: 5
  grad_clip: 1.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  box_weight: 2.0
  ctr_weight: 1.0
  box_mode: ltrb
  score_threshold: 0.005
  nms_threshold: 0.5
  val_interval: 5
  center_sampling_radius: 1.5

optim:
  lr: 0.0005
  weight_decay: 0.05
  pretrain_epochs: 100

data:
  source_manifest: /PROBE/data/japan_train.jsonl
  source_val_manifest: /PROBE/data/japan_val.jsonl
  target_manifest: /PROBE/data/czech_train.jsonl
  val_manifest: /PROBE/data/czech_val.jsonl
  image_root: /PROBE/data/images
  batch_size: 32
  num_workers: 8
